<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartChess 登入</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            color: #fff;
        }

        .login-box {
            width: 360px;
            padding: 32px;
            background: #1f2937;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 28px;
        }

        .error {
            margin-bottom: 16px;
            padding: 10px;
            background: #7f1d1d;
            border-radius: 8px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #4b5563;
            border-radius: 8px;
            background: #111827;
            color: #fff;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
        }

        .register-link a {
            color: #60a5fa;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>SmartChess 登入</h1>

    <div
        th:if="${error}"
        class="error"
        th:text="${error}">
    </div>

    <form action="/login" method="post" th:object="${loginDto}">

        <div class="form-group">
            <label for="username">帳號</label>
            <input
                id="username"
                type="text"
                th:field="*{username}"
                required
                autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">密碼</label>
            <input
                id="password"
                type="password"
                th:field="*{password}"
                required
                autocomplete="current-password">
        </div>

        <button type="submit">登入</button>

    </form>

    <div class="register-link">
        <a href="/register">還沒有帳號？立即註冊</a>
    </div>

</div>

</body>
</html>
