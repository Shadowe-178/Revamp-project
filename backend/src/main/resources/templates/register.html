<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>SmartChess 註冊</title>
</head>
<body>
<h1>SmartChess 註冊</h1>
<div th:if="${error}">
    <strong th:text="${error}"></strong>
</div>
<form action="/register" method="post" th:object="${registerDto}">
    <label>帳號：<input type="text" th:field="*{username}" required /></label><br />
    <label>密碼：<input type="password" th:field="*{password}" required /></label><br />
    <label>暱稱：<input type="text" th:field="*{displayName}" required /></label><br />
    <button type="submit">註冊</button>
</form>
<p><a href="/login">返回登入</a></p>
</body>
</html>
